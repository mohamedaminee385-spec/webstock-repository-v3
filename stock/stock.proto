
syntax = "proto3";

package stock;

enum OperationType {
  ADD = 0;
  SUBTRACT = 1;
}

message StockItemUpdate {
  string item_id = 1;
  int32 quantity = 2;
  OperationType operation = 3;
}

message BulkUpdateResponse {
  bool success = 1;
  int32 items_processed = 2;
  string message = 3;
}

service StockService {
  rpc BulkUpdateStock (stream StockItemUpdate) returns (BulkUpdateResponse);
}