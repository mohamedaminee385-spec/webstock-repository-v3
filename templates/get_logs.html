<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Get Logs</title>
    {% include "css.html" %}
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f8fafc;
        }

        /* 2. Flexbox container to center child element perfectly */
        body {
            display: flex;
            justify-content: center; /* Horizontally center */
            align-items: center;     /* Vertically center */
        }

        /* 1. Form Container Styling */
        .form-container {
            max-width: 400px;
            padding: 24px;
            background-color: #ffffff;

         /* Border Definition */
            border: 1px solid #e2e8f0;

            /* Border Radius: Rounded corners for the form card */
            border-radius: 12px;

            /* Optional shadow to elevate card appearance */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

            position: absolute;
        }
    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #334155;
    }

    /* 2. Text Input Styling */
    input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        box-sizing: border-box;
        font-size: 14px;

        /* Border Definition */
        border: 1px solid #cbd5e1;

        /* Border Radius: Slight rounding for input field */
        border-radius: 6px;

        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Focus state border highlight */
    input[type="number"]:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* 3. Submit Button Styling */
    button {
        width: 100%;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background-color: #2563eb;

        /* Border Definition (removed outer border for clean button appearance) */
        border: none;

        /* Border Radius: Matching rounding for button */
        border-radius: 6px;

        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    button:hover {
        background-color: #1d4ed8;
    }
    </style>
</head>
<body>
<div class="form-container" style="border: #cccccc; border-radius: 5px;">
    <form action="{% url 'audit:export_audit_pdf' %}" method="POST" target="_blank">
        {% csrf_token %}
        <div class="form-group">
            <label for="last_rows">Last Rows:</label>
            <input
                type="number"
                id="last_rows"
                name="last_rows"
                min="1"
                placeholder="e.g. 10"
                required
            >
        </div>
        <button type="submit">Submit & Generate PDF</button>
    </form>
</div>
</body>
{% include "js.html" %}
</html>
