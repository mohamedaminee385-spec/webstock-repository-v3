<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    {% include 'css.html' %}

</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f9;">
    <div style="border: 1px solid #ccc; border-radius: 8px; padding: 30px; width: 100%; max-width: 350px; background-color: #ffffff; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">
    <h2 style="margin-top: 0; margin-bottom: 20px; text-align: center;">Sign In</h2>

    {% if error %}
        <p style="color: red; text-align: center; margin-bottom: 15px;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="username" style="display: block; margin-bottom: 5px; font-weight: bold;">Username:</label>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold;">Password:</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Log In</button>
    </form>
    <form action="{% url 'accounts:register_view' %}" method="get" style="display: inline;">
        {% csrf_token %}
        <button type="submit" style="text-align: center; background: none; border: none; color: #007bff; cursor: pointer; text-decoration: underline; font-size: 16px;">
            You're not registered ! Sign up
        </button>
    </form>
    <br>
    {% if user.is_authenticated %}
         <a href="{% url 'accounts:password_change' %}">Change Password</a>
    {% endif %}
    </div>
{% include 'js.html' %}
</body>
</html>
